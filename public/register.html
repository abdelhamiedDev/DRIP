<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIP — CREATE ACCOUNT</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
            .hero-text span{
                color: #c8ff00;
            }

            .hero-text{
                font-size: 52px;
                font-weight: 900;
                letter-spacing: 2px;
                line-height: 1;
                margin-top: 15px;
                margin-bottom: 7px;
                text-transform: uppercase;
                font-family: var(--font-display);
            }


            .sub {
                color: #555;
                font-size: 14px;
                letter-spacing: 1px;
                line-height: 1.8;
                color: var(--muted);
                max-width: 360px;
                margin-bottom: 20px;
                line-height: 1.7;
                letter-spacing: 0px;
            }


            .success-banner {
                background: #c8ff00;
                color: #0d0d0d;
                padding: 12px 16px;
                font-size: 11px;
                letter-spacing: 2px;
                font-weight: 900;
                text-align: center;
                display: none;
                margin-bottom: 16px;
            }

            /* ── success banner ── */
            .success-banner {
                display: none;
                background: #c8ff00;
                color: #0d0d0d;
                font-size: 11px;
                font-weight: 900;
                letter-spacing: 2px;
                text-align: center;
                padding: 14px;
                text-transform: uppercase;
            }

            .success-banner.show { display: block; }



            .error-banner {
                background: #ff0000;
                color: #fff;
                padding: 12px 16px;
                font-size: 11px;
                letter-spacing: 2px;
                font-weight: 900;
                text-align: center;
                display: none;
                margin-bottom: 16px;
            }

            hr {
                border: none;
                border-top: 1px solid #333;
                margin: 20px 520px 20px ;
                max-width: 520px;
            }


            main {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 0px 20px 80px;
            }

            .form-title {
                color: #fff;
                font-size: 30px;
                letter-spacing: 3px;
                font-weight: 900;
                margin-bottom: 8px;
                margin-top: 7px;
                text-transform: uppercase;
                margin-left: 68px;
                
            }


            .form-card label {
                color: #888;
                font-size: 12px;
                letter-spacing: 2px;
                font-weight: 700;
                margin-right: 15px;
            }

            .form-card{
                width: 100%;
                max-width: 520px;
                border-left: 3px solid #c8ff00;
                padding: 36px 40px;
                background: #0f0f0f;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .field{
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .field label {
                font-size: 10px;
                letter-spacing: 2px;
                font-weight: 700;
                color: #888;
                text-transform: uppercase;
            }


            .field input {
                background: #111;
                border: 1px solid #222;
                border-radius: 10px;
                color: #fff;
                font-size: 13px;
                padding: 12px 16px;
                outline: none;
                font-family: inherit;
                letter-spacing: .5px;
                width: 100%;
            }

            .field input::placeholder { color: #3f3f3f; }
            .field input:focus { border-color: #c8ff00; }
            .field input.err { border-color: #ff4444; }


            /* ── error text ── */
            .err-txt {
                font-size: 10px;
                letter-spacing: 1px;
                color: #ff4444;
                display: none;
                text-transform: uppercase;
            }


            .err-txt.show { display: block; }


            /* ── password show/hide wrapper ── */
            .pass-wrap {
                position: relative;
            }

            .pass-wrap input {
                padding-right: 44px;
            }


            
            .toggle-pass {
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                cursor: pointer;
                color: #555;
                font-size: 14px;
                padding: 0;
                transition: color 0.15s;
            }

            .toggle-pass:hover { color: #c8ff00; }




                /* ── strength bars ── */
            .strength-bars {
                display: flex;
                gap: 4px;
                margin-top: 4px;
            }

            .s-bar {
                flex: 1;
                height: 2px;
                background: #2a2a2a;
                transition: background 0.3s;
            }

            .s-bar.weak { background: #ff4444; }
            .s-bar.fair { background: #ffaa00; }
            .s-bar.good { background: #c8ff00; }

            .s-label {
                font-size: 10px;
                letter-spacing: 2px;
                color: #555;
                text-transform: uppercase;
                margin-top: 4px;
            }

    /* ________________________________________________________________ */
            
        /* ── checkbox ── */
        .check-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .check-row input[type="checkbox"] {
            width: 15px;
            height: 15px;
            margin-top: 1px;
            accent-color: #c8ff00;
            cursor: pointer;
            flex-shrink: 0;
        }

        .check-row span {
            font-size: 11px;
            letter-spacing: 0.5px;
            color: #555;
            line-height: 1.7;
            text-transform: uppercase;
        }

        .check-row a { color: #c8ff00; text-decoration: none; }

        /* ── submit ── */
        .btn-submit {
            width: 100%;
            background: #c8ff00;
            color: #0d0d0d;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
            padding: 16px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            transition: opacity 0.15s;
            margin-top: 4px;
        }
        .btn-submit:hover { opacity: 0.85; }


                
        /* ── login link ── */
        .login-link {
            text-align: center;
            font-size: 11px;
            letter-spacing: 1px;
            color: #656565;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .login-link a {
            color: #c8ff00;
            text-decoration: none;
            font-weight: 700;
        }

        footer {
            border-top: 1px solid #1a1a1a;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-copy {
            font-size: 10px;
            letter-spacing: 1px;
            color: #656565;
            text-transform: uppercase;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .footer-links a {
            font-size: 10px;
            letter-spacing: 1px;
            color: #656565;
            text-decoration: none;
            text-transform: uppercase;
        }

        .footer-links a:hover { color: #888; }


    </style>
</head>
<body>
    <div id="navbar"></div>

    <center>
        <div class="hero-text">JOIN THE <span>DRIP</span></div>
        <div class="sub">ONE DRIP ONE CHANCE</div>
    </center>
    
    <hr>
    
    <div class="success-banner" id="success">ACCOUNT CREATED — WELCOME TO DRIP</div>
    <div class="error-banner" id="error">ERROR CREATING ACCOUNT - PLEASE TRY AGAIN</div>
    
    
    <main>
        
        <!-- FORM -->
        
        <div class="form-card">
            
            <div class="form-title">CREATE ACCOUNT</div>   

            <!-- FULL NAME -->
            <div class="field">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" placeholder="Zeyad Mohamed Aly">
            </div>

            <!-- EMAIL -->
            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>

            <!-- PASSWORD -->
            <div class="field">
                <label for="password">Password</label>
                <div class="pass-wrap">
                    <input type="password" id="password" placeholder="Min. 8 characters" oninput="checkStrength()">
                    <button type="button" class="toggle-pass" onclick="togglePass('password', this)">👁</button>
                </div>
                <div class="strength-bars">
                    <div class="s-bar" id="b1"></div>
                    <div class="s-bar" id="b2"></div>
                    <div class="s-bar" id="b3"></div>
                    <div class="s-bar" id="b4"></div>
                </div>
                <div class="s-label" id="s-label"></div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="field">
                <label for="confirm-password">Confirm Password</label>
                <div class="pass-wrap">
                    <input type="password" id="confirm-password" placeholder="Re-enter password">
                    <button type="button" class="toggle-pass" onclick="togglePass('confirm-password', this)">👁</button>
                </div>
            </div>

            <!-- CHECKBOX -->
            <div class="check-row">
                <input type="checkbox" id="terms">
                <span>I accept the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></span>
            </div>

            <!-- SUBMIT -->
            <button class="btn-submit" onclick="handleRegister()" >
                Create Account →
            </button>

            <!-- LOGIN LINK -->
            <div class="login-link">
                Already have an account? <a href="login.html">Sign In</a>
            </div>

        </div>
    </main>

    <footer>
        <span class="footer-copy">© 2026 DRIP. All rights reserved.</span>
        <ul class="footer-links">
            <li><a href="#">Terms</a></li>
            <li><a href="#">Privacy</a></li>
        </ul>
    </footer>




    <!-- لعبتك بقي أعبحميد -->





    <script src="app.js"></script>
    <script>
        /* ── password show/hide ── */
        function togglePass(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.style.color = '#c8ff00';
            } else {
                input.type = 'password';
                btn.style.color = '#555';
            }
        }

        /* ── password strength ── */
        function checkStrength() {
            const pass = document.getElementById('password').value;
            let score = 0;
            if (pass.length >= 8)           score++;
            if (/[A-Z]/.test(pass))         score++;
            if (/[0-9]/.test(pass))         score++;
            if (/[^A-Za-z0-9]/.test(pass))  score++;

            const cls   = ['', 'weak', 'fair', 'good', 'good'];
            const label = ['', 'Weak', 'Fair', 'Good', 'Strong'];
            const color = ['', '#ff4444', '#ffaa00', '#c8ff00', '#c8ff00'];

            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById('b' + i);
                bar.className = 's-bar' + (i <= score ? ' ' + cls[score] : '');
            }

            const lbl = document.getElementById('s-label');
            lbl.textContent = pass.length ? 'Strength: ' + label[score] : '';
            lbl.style.color = color[score] || '#555';
        }

        /* ── submit ── */

        async function handleRegister() {

            const full_name = document.getElementById('full-name').value.trim();
            const email     = document.getElementById('email').value.trim();
            const password  = document.getElementById('password').value;
            const confirm   = document.getElementById('confirm-password').value;
            const terms     = document.getElementById('terms').checked;

            if (!full_name || !email || !password) return alert('Fill in all fields');
            if (password !== confirm) return alert('Passwords do not match');
            if (!terms) return alert('Accept the terms first');

            try {
                const res = await fetch(`${API}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name, email, password })
                });

            const data = await res.json();
            if (!res.ok) return alert(data.error);
            document.getElementById('success').classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
            alert('Backend offline');
            }
        }
        
    </script>

</body>
</html>
