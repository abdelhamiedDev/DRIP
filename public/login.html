<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIP — SIGN IN</title>
    <link rel="icon" href="../favicon.png" type="image/png"/>
    <link rel="stylesheet" href="style.css"> 
    <style>
            .hero-text span{
                color: #c8ff00;
            }

            .hero-text{
                font-size: 52px;
                font-weight: 900;
                letter-spacing: 2px;
                line-height: 1;
                margin-top: 15px;
                margin-bottom: 7px;
                text-transform: uppercase;
                font-family: var(--font-display);
            }

            .sub {
                color: #555;
                font-size: 14px;
                letter-spacing: 1px;
                line-height: 1.8;
                color: var(--muted);
                max-width: 360px;
                margin-bottom: 20px;
                line-height: 1.7;
                letter-spacing: 0px;
            }

            .success-banner {
                display: none;
                background: #c8ff00;
                color: #0d0d0d;
                font-size: 11px;
                font-weight: 900;
                letter-spacing: 2px;
                text-align: center;
                padding: 14px;
                text-transform: uppercase;
            }

            .success-banner.show { display: block; }

            .error-banner {
                background: #ff0000;
                color: #fff;
                padding: 12px 16px;
                font-size: 11px;
                letter-spacing: 2px;
                font-weight: 900;
                text-align: center;
                display: none;
                margin-bottom: 16px;
                text-transform: uppercase;
            }

            .error-banner.show { display: block; }

            hr {
                border: none;
                border-top: 1px solid #333;
                margin: 20px 520px 20px;
                max-width: 520px;
            }

            main {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 0px 20px 80px;
            }

            .form-title {
                color: #fff;
                font-size: 30px;
                letter-spacing: 3px;
                font-weight: 900;
                margin-bottom: 8px;
                margin-top: 7px;
                text-transform: uppercase;
                margin-left: 68px;
            }

            .form-card label {
                color: #888;
                font-size: 12px;
                letter-spacing: 2px;
                font-weight: 700;
                margin-right: 15px;
            }

            .form-card {
                width: 100%;
                max-width: 520px;
                border-left: 3px solid #c8ff00;
                padding: 36px 40px;
                background: #0f0f0f;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .field label {
                font-size: 10px;
                letter-spacing: 2px;
                font-weight: 700;
                color: #888;
                text-transform: uppercase;
            }

            .field input {
                background: #111;
                border: 1px solid #222;
                border-radius: 10px;
                color: #fff;
                font-size: 13px;
                padding: 12px 16px;
                outline: none;
                font-family: inherit;
                letter-spacing: .5px;
                width: 100%;
            }

            .field input::placeholder { color: #3f3f3f; }
            .field input:focus { border-color: #c8ff00; }
            .field input.err { border-color: #ff4444; }

            .err-txt {
                font-size: 10px;
                letter-spacing: 1px;
                color: #ff4444;
                display: none;
                text-transform: uppercase;
            }

            .err-txt.show { display: block; }

            /* ── password show/hide wrapper ── */
            .pass-wrap {
                position: relative;
            }

            .pass-wrap input {
                padding-right: 44px;
            }

            .toggle-pass {
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                cursor: pointer;
                color: #555;
                font-size: 14px;
                padding: 0;
                transition: color 0.15s;
            }

            .toggle-pass:hover { color: #c8ff00; }

            /* ── forgot password ── */
            .forgot-row {
                display: flex;
                justify-content: flex-end;
                margin-top: -10px;
            }

            .forgot-row a {
                font-size: 10px;
                letter-spacing: 1.5px;
                color: #555;
                text-decoration: none;
                text-transform: uppercase;
                transition: color 0.15s;
            }

            .forgot-row a:hover { color: #c8ff00; }

            /* ── submit ── */
            .btn-submit {
                width: 100%;
                background: #c8ff00;
                color: #0d0d0d;
                font-size: 11px;
                font-weight: 900;
                letter-spacing: 3px;
                padding: 16px;
                border: none;
                cursor: pointer;
                font-family: inherit;
                text-transform: uppercase;
                transition: opacity 0.15s;
                margin-top: 4px;
            }

            .btn-submit:hover { opacity: 0.85; }

            /* ── register link ── */
            .register-link {
                text-align: center;
                font-size: 11px;
                letter-spacing: 1px;
                color: #656565;
                text-transform: uppercase;
                margin-top: 8px;
            }

            .register-link a {
                color: #c8ff00;
                text-decoration: none;
                font-weight: 700;
            }

            footer {
                border-top: 1px solid #1a1a1a;
                padding: 20px 40px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .footer-copy {
                font-size: 10px;
                letter-spacing: 1px;
                color: #656565;
                text-transform: uppercase;
            }

            .footer-links {
                display: flex;
                gap: 24px;
                list-style: none;
            }

            .footer-links a {
                font-size: 10px;
                letter-spacing: 1px;
                color: #656565;
                text-decoration: none;
                text-transform: uppercase;
            }

            .footer-links a:hover { color: #888; }
    </style>
</head>
<body>
    <div id="navbar"></div>

    <center>
        <div class="hero-text">WELCOME BACK TO <span>DRIP</span></div>
        <div class="sub">ONE DRIP ONE CHANCE</div>
    </center>

    <hr>

    <div class="success-banner" id="success">SIGNED IN — WELCOME BACK</div>
    <div class="error-banner" id="error">INVALID EMAIL OR PASSWORD — TRY AGAIN</div>

    <main>

        <!-- FORM -->

        <div class="form-card">

            <div class="form-title">SIGN IN</div>

            <!-- EMAIL -->
            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@gmail.com">
                <span class="err-txt" id="email-err">Please enter a valid email</span>
            </div>

            <!-- PASSWORD -->
            <div class="field">
                <label for="password">Password</label>
                <div class="pass-wrap">
                    <input type="password" id="password" placeholder="Enter your password">
                    <button type="button" class="toggle-pass" onclick="togglePass('password', this)">👁</button>
                </div>
                <span class="err-txt" id="pass-err">Password cannot be empty</span>
            </div>

            <!-- FORGOT PASSWORD -->
            <div class="forgot-row">
                <a href="#">Forgot Password?</a>
            </div>

            <!-- SUBMIT -->
            <button class="btn-submit" onclick="handleLogin()">
                Sign In →
            </button>

            <!-- REGISTER LINK -->
            <div class="register-link">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>

        </div>
    </main>

    <footer>
        <span class="footer-copy">© 2026 DRIP. All rights reserved.</span>
        <ul class="footer-links">
            <li><a href="#">Terms</a></li>
            <li><a href="#">Privacy</a></li>
        </ul>
    </footer>

    <script>
        /* ── password show/hide ── */
        function togglePass(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.style.color = '#c8ff00';
            } else {
                input.type = 'password';
                btn.style.color = '#555';
            }
        }

        /* ── submit ── */
        async function handleLogin() {
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) return alert('Fill in all fields');

            try {
                const res = await fetch(`${API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error);

                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('full_name', data.full_name);

                document.getElementById('success').classList.add('show');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => window.location.href = 'index.html', 1500);
            } catch (err) {
                alert('Backend offline');
            }
        }
        
    </script>

    <script src="app.js"></script>
</body>
</html>
